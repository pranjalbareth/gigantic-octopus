apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-server
  namespace: system
  labels:
    app.kubernetes.io/name: runway
    app.kubernetes.io/component: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: runway
      app.kubernetes.io/component: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runway
        app.kubernetes.io/component: portal
    spec:
      serviceAccountName: portal
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: portal
        image: controller:latest
        command:
        - /portal
        args:
        # Demo sign-in: anyone picks a name, no password. For real logins
        # deploy config/github-login instead, which swaps this for --auth=proxy.
        - --auth=dev
        - --listen=:8080
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          limits:
            cpu: 250m
            memory: 96Mi
          requests:
            cpu: 10m
            memory: 32Mi
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: system
  labels:
    app.kubernetes.io/name: runway
    app.kubernetes.io/component: portal
spec:
  selector:
    app.kubernetes.io/name: runway
    app.kubernetes.io/component: portal
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
