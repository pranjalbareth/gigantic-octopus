apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal
  namespace: system
---
# The portal's whole permission set: act as a user. It has no rights on
# Environments of its own, so a bug in the portal cannot do anything the
# signed-in user could not do with kubectl.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portal-impersonator
rules:
- apiGroups: [""]
  resources: ["users"]
  verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portal-impersonator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portal-impersonator
subjects:
- kind: ServiceAccount
  name: portal
  namespace: system
