---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-runway-pranjalbareth-github-io-v1alpha1-environment
  failurePolicy: Fail
  name: menvironment-v1alpha1.kb.io
  rules:
  - apiGroups:
    - runway.pranjalbareth.github.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - environments
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-runway-pranjalbareth-github-io-v1alpha1-environment
  failurePolicy: Fail
  name: venvironment-v1alpha1.kb.io
  rules:
  - apiGroups:
    - runway.pranjalbareth.github.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - environments
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-runway-pranjalbareth-github-io-v1alpha1-environmenttemplate
  failurePolicy: Fail
  name: venvironmenttemplate-v1alpha1.kb.io
  rules:
  - apiGroups:
    - runway.pranjalbareth.github.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - environmenttemplates
  sideEffects: None
