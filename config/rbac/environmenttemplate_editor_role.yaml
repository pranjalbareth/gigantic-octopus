# This rule is not used by the project runway itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the runway.pranjalbareth.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: runway
    app.kubernetes.io/managed-by: kustomize
  name: environmenttemplate-editor-role
rules:
- apiGroups:
  - runway.pranjalbareth.github.io
  resources:
  - environmenttemplates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - runway.pranjalbareth.github.io
  resources:
  - environmenttemplates/status
  verbs:
  - get
