apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "runway.resourceName" (dict "suffix" "environment-ownership-binding" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  policyName: {{ include "runway.resourceName" (dict "suffix" "environment-ownership" "context" $) }}
  validationActions:
  - Deny
