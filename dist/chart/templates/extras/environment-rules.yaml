apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "runway.resourceName" (dict "suffix" "environment-rules" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - runway.pranjalbareth.github.io
      apiVersions:
      - v1alpha1
      operations:
      - CREATE
      - UPDATE
      resources:
      - environments
  validations:
  - expression: object.metadata.name.matches('^[a-z0-9][-a-z0-9]{1,38}[a-z0-9]$')
    message: metadata.name must be 3-40 lowercase letters, digits or hyphens, and
      start and end with a letter or digit
  - expression: has(object.spec.ttl) && duration(object.spec.ttl) >= duration('1m')
      && duration(object.spec.ttl) <= duration('168h')
    message: spec.ttl must be between 1m and 168h
  - expression: oldObject == null || object.spec.template == oldObject.spec.template
    message: spec.template cannot be changed; create a new Environment instead
  - expression: oldObject == null || !has(oldObject.spec.owner) || (has(object.spec.owner)
      && object.spec.owner == oldObject.spec.owner)
    message: spec.owner cannot be changed
