apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: RoleBinding
{{- else }}
kind: ClusterRoleBinding
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "runway.resourceName" (dict "suffix" "portal-impersonator-binding" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  {{- if .Values.rbac.namespaced }}
  kind: Role
  {{- else }}
  kind: ClusterRole
  {{- end }}
  name: {{ include "runway.resourceName" (dict "suffix" "portal-impersonator" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "runway.resourceName" (dict "suffix" "portal" "context" $) }}
  namespace: {{ .Release.Namespace }}
