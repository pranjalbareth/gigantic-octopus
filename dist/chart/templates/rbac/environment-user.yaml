apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "runway.resourceName" (dict "suffix" "environment-user" "context" $) }}
rules:
- apiGroups:
  - runway.pranjalbareth.github.io
  resources:
  - environments
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - runway.pranjalbareth.github.io
  resources:
  - environmenttemplates
  verbs:
  - get
  - list
  - watch
