apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "runway.resourceName" (dict "suffix" "portal-impersonator" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - users
  verbs:
  - impersonate
